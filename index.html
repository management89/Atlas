<noscript><p style="padding:16px">Avenues Student Hub needs JavaScript. It lists events, sign-ups, the weekly bulletin, opportunities and Student Council news for Avenues The World School.</p></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap">
<style>
/* Hall pass. One bold move: a pennant-gold rail with heavy Franklin Gothic navigation. The work area stays quiet: white ground, navy ink, sections marked by a thick ink rule, cards only for real objects. Everything left-aligned. */
:root{
  --ground:#F1F3F5; --surface:#FFFFFF; --ink:#14202E; --muted:#56606C; --rule:#CCD2D9; --rule-strong:#14202E;
  --rail:#F4B400; --rail-ink:#14202E; --rail-dim:rgba(20,32,46,.72); --rail-hover:rgba(20,32,46,.1);
  --info:#2650B8; --info-soft:#E3E9F8; --good:#1D7A45; --good-soft:#DFF0E5; --bad:#B3261E; --bad-soft:#F8E1DF; --warn:#8A5A00; --warn-soft:#FBEFC9;
  --paper:#FFFFFF; --paper-ink:#14202E; --paper-muted:#5E6873; --paper-line:#D5DAE0; --paper-gold:#F4B400;
  --scrim:rgba(20,32,46,.55); --stage:#0E141B;
  --f:"Libre Franklin","Franklin Gothic","Franklin Gothic Book","ITC Franklin Gothic","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0F151C; --surface:#18212B; --ink:#E8ECF0; --muted:#9BA6B2; --rule:#2B3642; --rule-strong:#E8ECF0;
  --rail:#E9AC00; --info:#8EA9FF; --info-soft:#1E2B4D; --good:#5CC98A; --good-soft:#15301F; --bad:#FF8A80; --bad-soft:#3A1B19; --warn:#F0C24A; --warn-soft:#3A2E10;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0F151C; --surface:#18212B; --ink:#E8ECF0; --muted:#9BA6B2; --rule:#2B3642; --rule-strong:#E8ECF0;
  --rail:#E9AC00; --info:#8EA9FF; --info-soft:#1E2B4D; --good:#5CC98A; --good-soft:#15301F; --bad:#FF8A80; --bad-soft:#3A1B19; --warn:#F0C24A; --warn-soft:#3A2E10;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f);text-wrap:balance;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

/* the rail: the one loud element */
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:28px 18px;padding-left:max(18px,env(safe-area-inset-left,0px));background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.top-row{display:flex;flex-direction:column;gap:18px}
.brand b{display:block;font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:.95}
.brand small{display:block;font-size:14px;color:var(--rail-dim);margin-top:4px}
.me{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0;padding-top:14px;border-top:2px solid var(--rail-ink)}
.me .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .title{font-weight:700}
.me .sub{color:var(--rail-dim)}
nav{display:flex;flex-direction:column;gap:2px;margin-inline:-8px}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:3px;color:var(--rail-ink);text-decoration:none;font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
nav a:hover{background:var(--rail-hover)}
nav a[aria-current="page"]{background:var(--rail-ink);color:var(--rail)}
nav a .count{font-size:13px;font-weight:700;min-width:22px;text-align:center;padding:0 6px;border-radius:3px;background:var(--rail-ink);color:var(--rail)}
nav a[aria-current="page"] .count{background:var(--rail);color:var(--rail-ink)}
.status{margin-top:auto;font-size:13px;color:var(--rail-dim);display:flex;gap:8px;align-items:flex-start}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rail-dim);margin-top:6px;flex:none}
.status.ok .dot{background:#1D7A45} .status.err .dot{background:#B3261E}

/* work area */
main{padding-block:40px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px;padding-inline:8px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head h1{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1}
.context{margin:8px 0 0;color:var(--muted);font-size:17px;max-width:62ch}
.btn{border:1.5px solid var(--rule-strong);background:transparent;border-radius:3px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink);opacity:.88}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{border-color:var(--rule)}
.btn.danger{color:var(--bad)}
.btn.good{background:var(--good);color:var(--surface);border-color:var(--good)}
.btn.sm{padding:4px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.banner{border-left:4px solid var(--rail);background:var(--surface);padding:12px 16px;font-size:15px;max-width:80ch}
.banner a{color:var(--info);font-weight:600}
.panel{border-top:3px solid var(--rule-strong);padding-top:12px;min-width:0}
.panel h2{font-size:22px;font-weight:800;letter-spacing:-.015em;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 a{font-size:15px;font-weight:600;color:var(--info);text-decoration:none}
.panel h2 a:hover{text-decoration:underline}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 40px}
.list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.list li{padding:12px 0;border-top:1px solid var(--rule);display:flex;gap:14px;align-items:flex-start;min-width:0}
.list li:first-child{border-top:0}
.datebox{width:46px;flex:none;text-align:center;line-height:1}
.datebox .m{font-size:13px;color:var(--muted);font-weight:600}
.datebox .d{font-weight:800;font-size:26px;letter-spacing:-.02em;margin-top:2px}
.grow{flex:1;min-width:0}
.title{font-weight:700;overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--muted)}
.parts{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:1px 7px;border-radius:3px;background:var(--ground);color:var(--muted);white-space:nowrap;border:1px solid var(--rule)}
.chip.meeting,.chip.accent{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.event,.chip.gold{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.deadline,.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.fundraiser,.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;object-fit:cover}
.avatar.lg{width:38px;height:38px;font-size:14px}
.avatar.xl{width:76px;height:76px;font-size:24px}
.who{display:inline-flex;align-items:center;gap:7px;font-size:14px;min-width:0}
.summary{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:16px;color:var(--muted)}
.summary b{color:var(--ink);font-weight:800}
.empty{padding:24px 0 8px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:60ch}
.empty strong{color:var(--ink);font-size:18px;font-weight:700}
.start{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end;background:var(--surface);border-left:6px solid var(--rail);padding:24px 26px}
.start h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
.start ol{margin:12px 0 0;padding-left:22px;color:var(--muted)}
.start .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

/* calendar */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calbar h2{font-size:28px;font-weight:800;letter-spacing:-.02em;min-width:200px}
.calscroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:3px solid var(--rule-strong);min-width:320px}
.cal .dow{font-size:14px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--rule)}
.cal .day{background:transparent;min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:0;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);text-align:left;align-items:stretch;min-width:0}
.cal .day:nth-child(7n){border-right:0}
.cal .day:hover{background:var(--surface)}
.cal .day.out{color:var(--muted);opacity:.55}
.cal .num{font-size:15px;font-weight:700}
.cal .day.today .num{background:var(--rail);color:var(--rail-ink);border-radius:3px;padding:0 6px;align-self:flex-start}
.cal .ev{font-size:12px;font-weight:600;padding:1px 5px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;border:0}
.cal .ev.task{background:transparent;color:var(--muted);font-weight:500;padding-left:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px}

/* tasks */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select,.toolbar input{border:1.5px solid var(--rule);background:var(--surface);border-radius:3px;padding:7px 10px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}
.col{border-top:3px solid var(--rule-strong);padding-top:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col h3{font-size:19px;font-weight:800;display:flex;justify-content:space-between}
.col h3 .mono{color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card.mine{border-left:5px solid var(--rail)}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card .detail{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.pri{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pri.high{background:var(--bad)} .pri.normal{background:var(--warn)} .pri.low{background:var(--rule)}
.iconbtns{display:flex;gap:4px;flex-wrap:wrap}
.ib{border:1.5px solid var(--rule);background:transparent;border-radius:3px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;color:var(--muted);font-weight:700}
.ib:hover{color:var(--ink);border-color:var(--ink)}
.overdue{color:var(--bad);font-weight:700}

/* bulletin */
.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.post{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.post.pinned{grid-column:1/-1;border:0;border-top:6px solid var(--rail);border-radius:0 0 6px 6px}
.post.pinned h3{font-size:30px}
.post h3{font-size:23px;font-weight:800;letter-spacing:-.015em}
.post p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch;font-size:16px}
.post .meta{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}

/* split views */
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
.pick{display:flex;flex-direction:column;border-top:3px solid var(--rule-strong)}
.pick button{text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:12px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pick button:hover{background:var(--surface)}
.pick button[aria-pressed="true"]{background:var(--surface);box-shadow:inset 5px 0 0 var(--rail)}
.steps{display:flex;flex-wrap:wrap;gap:0}
.steps span{font-size:14px;padding:5px 12px;color:var(--muted);font-weight:600;border:1.5px solid var(--rule);margin-left:-1.5px}
.steps span:first-child{margin-left:0;border-radius:3px 0 0 3px}
.steps span:last-child{border-radius:0 3px 3px 0}
.steps span.on{background:var(--ink);color:var(--ground);border-color:var(--ink);position:relative}
.steps span.done{color:var(--ink)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:14px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1.5px solid var(--rule-strong)}
td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{border:0;border-left:1.5px solid var(--rule);background:transparent;padding:5px 11px;font-size:14px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button:first-child{border-left:0}
.seg button:not(:disabled):hover{color:var(--ink)}
.seg button[aria-pressed="true"].present,.seg button[aria-pressed="true"].aye{background:var(--good);color:var(--surface);font-weight:700}
.seg button[aria-pressed="true"].late,.seg button[aria-pressed="true"].abstain{background:var(--warn-soft);color:var(--warn);font-weight:700}
.seg button[aria-pressed="true"].excused{background:var(--info-soft);color:var(--info);font-weight:700}
.seg button[aria-pressed="true"].absent,.seg button[aria-pressed="true"].nay{background:var(--bad);color:var(--surface);font-weight:700}
.seg button:disabled{cursor:default}
.tally{display:flex;gap:30px;flex-wrap:wrap}
.tally div{display:flex;flex-direction:column}
.tally b{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bar{height:10px;border-radius:2px;background:var(--rule);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* proposal document */
.paperwrap{background:var(--rule);padding:22px;overflow-x:auto;border-radius:4px}
.paper{background:var(--paper);color:var(--paper-ink);font-family:var(--f);max-width:720px;margin:0 auto;padding:52px 56px;position:relative;font-size:15.5px;line-height:1.6;min-width:0;border-top:10px solid var(--paper-gold)}
.paper .org{font-size:14px;color:var(--paper-muted);font-weight:500}
.paper .kicker{font-size:15px;font-weight:700;color:var(--paper-ink);margin-top:22px}
.paper .dtitle{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:4px 0 20px;overflow-wrap:anywhere}
.paper .meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 22px;font-size:14px;padding-bottom:18px;border-bottom:3px solid var(--paper-ink)}
.paper .meta dt{color:var(--paper-muted);font-weight:600}
.paper .meta dd{margin:0;overflow-wrap:anywhere}
.paper h4{font-size:18px;font-weight:800;letter-spacing:-.01em;color:var(--paper-ink);margin:26px 0 6px}
.paper p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.paper .hint{color:var(--paper-muted);font-style:italic}
.paper table{font-size:14.5px}
.paper td,.paper th{border-bottom:1px solid var(--paper-line);color:var(--paper-ink)}
.paper th{color:var(--paper-muted);border-bottom:1.5px solid var(--paper-ink)}
.paper td.amt,.paper th.amt{text-align:right}
.paper tr.total td{font-weight:800;border-bottom:0}
.paper .res{border-left:5px solid var(--paper-gold);padding-left:16px;font-weight:500}
.paper .res.hint{font-weight:400}
.paper .sigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-top:48px;font-size:13px;color:var(--paper-muted)}
.paper .sigs div{border-top:1.5px solid var(--paper-ink);padding-top:6px}
.paper .wm{position:absolute;top:36%;left:0;right:0;text-align:center;font-size:96px;font-weight:900;color:var(--paper-ink);opacity:.045;transform:rotate(-28deg);pointer-events:none;letter-spacing:.04em}
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
.edform{display:flex;flex-direction:column;gap:16px}
.edform .hint-text{font-size:14px;color:var(--muted)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 112px 32px;gap:6px}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}

/* members */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.person{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.person.me-card{border-top:6px solid var(--rail)}
.person .top{display:flex;gap:14px;align-items:center}
.person p{margin:0;font-size:15px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.stats{display:flex;gap:16px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:800}
.photo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* who's working on what */
.seg.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:700}
.prow{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;padding:18px 0;border-bottom:1px solid var(--rule);align-items:start}
.prow:first-child{border-top:3px solid var(--rule-strong)}
.prow .person-id{display:flex;gap:12px;align-items:center;min-width:0}
.prow .person-id .title{font-size:18px;font-weight:800;letter-spacing:-.01em}
.ptasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ptasks li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding-left:14px;border-left:4px solid var(--rule)}
.ptasks li.doing{border-left-color:var(--rail)}
.ptasks li.done{border-left-color:var(--good);opacity:.7}
.ptasks li .title{font-size:16px}
.ptasks li .sub{grid-column:1/-1}
.state{font-size:14px;font-weight:700;white-space:nowrap}
.state.doing{color:var(--ink)} .state.todo{color:var(--muted)} .state.wait{color:var(--warn)} .state.done{color:var(--good)}

/* suggestions */
.sugs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:3px solid var(--rule-strong)}
.sugs>li{padding:16px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.sugs .sug-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.sugs .sug-head .title{font-size:18px}
.sugs p{margin:0;max-width:70ch;white-space:pre-wrap;overflow-wrap:anywhere}
.reply{border-left:4px solid var(--rail);padding:6px 0 6px 12px;background:var(--surface);max-width:70ch}

<script>
const STUDENT_NAV=[["hub","Student Hub"],["events","Events"],["life","Student Life"],["opportunities","Opportunities"],["voice","Student Voice"]];

const KINDS=[["all","Everything"],["task","Tasks"],["proposal","Proposals"],["event","Calendar"],["post","Bulletin"],["meeting","Attendance"],["member","Members"],["suggestion","Suggestions"],["album","Photos"],["story","Stories"],["opportunity","Opportunities"],["poll","Polls"]];

  summary:"One or two sentences: what you want the council to approve.",

let db=null,U=null,canWrite=true,isEditor=false,taskMode=null,sugFilter="open",dbState="connecting",loaded=new Set();

const $=s=>document.querySelector(s);

const byDate=(a,b)=>(a.date||"9999").localeCompare(b.date||"9999")||(a.time||"").localeCompare(b.time||"");

/* ---------- people & permissions ---------- */
const isApproved=d=>!!(d&&(d.manual||d.sample||CFG.approved[d.id]||d.id===CFG.president));
const full=d=>d&&({...d,role:CFG.roles[d.id]||d.role||"Member"});

const allowed=v=>!!ROUTES[v]&&(council()||STUDENT_ROUTES.includes(v)||(v==="members"&&canJoin()));

let logQ=Promise.resolve();
function log(a,k,title){
  if(!db)return;
  const now=new Date(),mk=iso(now).slice(0,7),key=now.getTime().toString(36)+Math.random().toString(36).slice(2,6);
  const entry={t:now.toISOString(),by:me.id||null,a,k,title:String(title||"").slice(0,160)};
  logQ=logQ.then(async()=>{const ref=db.doc("history/"+mk);try{if(S.history.some(h=>h.id===mk))await ref.update({entries:{[key]:entry}});else await ref.set({entries:{[key]:entry}})}catch(e){}});
}
async function save(fn,okMsg,entry){
  if(!db){toast("Saving isn't available in this view.");return false}
  try{await fn();if(okMsg)toast(okMsg);if(entry)log(...entry);return true}
  catch(e){
    if(e&&e.code==="invalid_argument")toast("You don't have permission to make that change.");
    else if(e&&e.code==="quota_exceeded")toast("The council's storage is full. Delete old items, then try again.");
    else toast("Couldn't save that change. Check your connection and try again.");
    return false
  }
}

/* ---------- tasks model ---------- */
const claimsOf=uid=>(S.claims.find(c=>c.id===uid)||{}).tasks||{};
function taskState(t){
  let owner=t.assignee||null,claim=null;
  if(owner)claim=claimsOf(owner)[t.id]||null;
  else{let best=null;for(const c of S.claims){const x=(c.tasks||{})[t.id];if(x&&(!best||x.at<best.x.at))best={uid:c.id,x}}if(best){owner=best.uid;claim=best.x}}
  let status="todo",at="";
  if(claim){status=claim.status==="accepted"?"todo":claim.status;at=claim.at||""}
  if(t.statusAt&&t.statusAt>at)status=t.status||"todo";
  return{owner,accepted:!!claim,status,open:!t.assignee&&!claim}
}
function setClaim(tid,status){const mine={...claimsOf(me.id)};if(status)mine[tid]={status,at:new Date().toISOString()};else delete mine[tid];return db.doc("claims/"+me.id).set({tasks:mine})}

/* calendar */
function calendar(){

  const rows=days[35].getMonth()!==m.getMonth()?days.slice(0,35):days;
  const evs=S.events.slice().sort(byDate);
  const dues=S.tasks.filter(t=>t.due&&taskState(t).status!=="done");
  const monthKey=iso(m).slice(0,7);
  const monthEvents=evs.filter(e=>(e.date||"").startsWith(monthKey));
  return head("Meetings, school events, dances, trips, competitions and deadlines.","Calendar",addBtn("add-event","Add event"))+
  `<div class="calbar"><button class="btn sm" data-act="cal-prev" aria-label="Previous month">←</button><h2>${m.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2><button class="btn sm" data-act="cal-next" aria-label="Next month">→</button><button class="btn sm ghost" data-act="cal-today">Today</button><span class="sp"></span><div class="legend">${EV_TYPES.map(([k,l])=>`<span class="chip ${k}">${l}</span>`).join("")}</div></div>
  <div class="calscroll"><div class="cal">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="dow">${d}</div>`).join("")}
  ${rows.map(d=>{const k=iso(d),de=evs.filter(e=>e.date===k),dt=dues.filter(t=>t.due===k);
    return`<button class="day ${d.getMonth()!==m.getMonth()?"out":""} ${k===TODAY?"today":""}" data-act="day" data-date="${k}" aria-label="${d.toDateString()}, ${de.length} events"><span class="num">${d.getDate()}</span>${de.map(e=>`<span class="ev chip ${esc(e.type)}" title="${esc(e.title)}">${esc(e.title)}</span>`).join("")}${dt.map(t=>`<span class="ev task" title="Task due: ${esc(t.title)}">☐ ${esc(t.title)}</span>`).join("")}</button>`}).join("")}
  </div></div>
  <section class="panel"><h2>This month</h2>${monthEvents.length?`<ul class="list">${monthEvents.map(evRow).join("")}</ul>`:`<p class="sub" style="margin:10px 0 0">Nothing scheduled this month.${canAct()?" Click a day to add something.":""}</p>`}</section>`;
}

/* tasks */
function taskToggle(){return council()?`<div class="seg toggle" role="group" aria-label="Task layout"><button data-act="task-mode" data-to="people" aria-pressed="${taskLayout()==="people"}">By person</button><button data-act="task-mode" data-to="board" aria-pressed="${taskLayout()==="board"}">Board</button></div>`:""}
const taskLayout=()=>council()?(taskMode||"board"):"people";
function tasks(force){
  if(!force&&taskLayout()==="board")return taskBoard().replace('<div class="toolbar">','<div class="toolbar">'+taskToggle());
  const all=S.tasks.map(t=>({t,st:taskState(t)}));
  const groups=new Map();
  for(const x of all){if(x.st.status==="done"&&x.t.due&&x.t.due<iso(addDays(new Date(),-14)))continue;const k=x.st.open?"_open":(x.st.owner||"_open");if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)}
  const rank={doing:0,todo:1,done:2};
  const people=[...roster().map(m=>m.id).filter(id=>groups.has(id)),...[...groups.keys()].filter(k=>k!=="_open"&&!roster().some(m=>m.id===k))];
  const active=all.filter(x=>x.st.status==="doing").length,people2=new Set(all.filter(x=>x.st.status!=="done"&&x.st.owner).map(x=>x.st.owner)).size;
  const stateOf=st=>st.status==="doing"?["doing","Working on it"]:st.status==="done"?["done","Done"]:st.open?["todo","Open"]:!st.accepted?["wait","Assigned, not accepted yet"]:["todo","Up next"];
  const li=x=>{const[c,l]=stateOf(x.st);return`<li class="${x.st.status}"><span class="title">${esc(x.t.title)}</span><span class="state ${c}">${l}</span><span class="sub parts">${x.t.due?`<span>${dueText(x.t,x.st)}</span>`:""}${x.t.committee?`<span>${esc(x.t.committee)}</span>`:""}</span></li>`};
  const sortItems=a=>a.sort((p,q)=>rank[p.st.status]-rank[q.st.status]||(p.t.due||"9999").localeCompare(q.t.due||"9999"));
  return head(`What everyone on Student Council is working on right now. ${active} task${active===1?"":"s"} in progress across ${people2} ${people2===1?"person":"people"}.`,"Who's working on what",(force?"":taskToggle())+(!force&&isPres&&W()?`<button class="btn primary" data-act="add-task">+ Assign task</button>`:""))+
  (people.length||groups.has("_open")?`<div>${people.map(id=>{const m=member(id);return`<section class="prow"><div class="person-id">${avatar(id,"lg")}<div class="grow"><div class="title">${esc(nameOf(id))}</div><div class="sub">${esc(m?m.role:"")}</div></div></div><ul class="ptasks">${sortItems(groups.get(id)).map(li).join("")}</ul></section>`}).join("")}${groups.has("_open")?`<section class="prow"><div class="person-id"><div class="grow"><div class="title">Not picked up yet</div><div class="sub">Any council member can accept these</div></div></div><ul class="ptasks">${sortItems(groups.get("_open")).map(li).join("")}</ul></section>`:""}</div>`
  :empty("No tasks yet",isPres?"Assign a task and it shows up here under the person doing it.":"When Student Council takes on work, you'll see who is doing what here.","add-task","Assign the first task",isPres&&W()));
}
function taskBoard(){
  let list=S.tasks.map(t=>({t,st:taskState(t)}));
  if(taskFilter==="mine")list=list.filter(x=>x.st.owner===me.id);
  else if(taskFilter==="open")list=list.filter(x=>x.st.open);
  else if(taskFilter!=="all")list=list.filter(x=>x.st.owner===taskFilter);
  const sorter=(a,b)=>(a.t.due||"9999").localeCompare(b.t.due||"9999");
  const opts=[["all","Everyone"],...(me.id&&amMember()?[["mine","My tasks"]]:[]),["open","Open to accept"],...roster().map(m=>[m.id,m.name])];
  return head("","Tasks",isPres&&W()?`<button class="btn primary" data-act="add-task">+ Assign task</button>`:"")+
  `<div class="toolbar"><label for="taskFilter" class="sub">Show</label><select id="taskFilter">${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===taskFilter?"selected":""}>${esc(l)}</option>`).join("")}</select><span class="sub">${isPres?"As president, you assign and move tasks. Members accept the tasks given to them, or pick up open ones.":"The president assigns tasks. Accept the ones given to you, or pick up an open task."}</span></div>`+
  (S.tasks.length?`<div class="board">${TASK_STATUS.map(([k,l],i)=>{const items=list.filter(x=>x.st.status===k).sort(sorter);
    return`<div class="col"><h3>${l}<span class="mono muted">${items.length}</span></h3>${items.map(x=>taskCard(x.t,x.st,i)).join("")||`<p class="sub" style="padding:0 6px">Nothing here.</p>`}</div>`}).join("")}</div>`
  :empty("No tasks yet",isPres?"Assign a task to a member, or leave it open so anyone can accept it. Due dates show on the calendar.":"When the president assigns tasks, they show up here.","add-task","Assign the first task",isPres&&W()));
}
function taskCard(t,st,i){
  const mine=me.id&&st.owner===me.id,acts=[];
  if(canAct()&&me.id){
    if(st.open)acts.push(`<button class="btn sm good" data-act="t-accept" data-id="${t.id}">Accept task</button>`);
    else if(mine&&!st.accepted)acts.push(`<button class="btn sm good" data-act="t-accept" data-id="${t.id}">Accept</button>`);
    else if(mine&&st.accepted){
      if(st.status==="todo")acts.push(`<button class="btn sm" data-act="t-claim" data-id="${t.id}" data-to="doing">Start</button>`);
      if(st.status==="doing")acts.push(`<button class="btn sm good" data-act="t-claim" data-id="${t.id}" data-to="done">Mark done</button>`);
      if(st.status==="done")acts.push(`<button class="btn sm ghost" data-act="t-claim" data-id="${t.id}" data-to="doing">Reopen</button>`);
      if(!t.assignee&&st.status!=="done")acts.push(`<button class="btn sm ghost" data-act="t-drop" data-id="${t.id}">Drop</button>`);
    }
  }
  const pres=isPres&&W()?`<div class="iconbtns">${i>0?`<button class="ib" data-act="task-move" data-id="${t.id}" data-to="${TASK_STATUS[i-1][0]}" aria-label="Move to ${TASK_STATUS[i-1][1]}">←</button>`:""}${i<2?`<button class="ib" data-act="task-move" data-id="${t.id}" data-to="${TASK_STATUS[i+1][0]}" aria-label="Move to ${TASK_STATUS[i+1][1]}">→</button>`:""}<button class="ib" data-act="edit-task" data-id="${t.id}" aria-label="Edit task">✎</button></div>`:"";
  return`<article class="card ${mine?"mine":""}"><div class="row"><span class="title">${esc(t.title)}</span><span class="pri ${esc(t.priority||"normal")}" title="${label(PRI,t.priority||"normal")} priority"></span></div>${t.details?`<div class="detail">${esc(t.details)}</div>`:""}<div class="row">${who(st.owner,"Open to anyone")}<span class="sub">${dueText(t,st)}</span></div><div class="row">${statusChip(t,st)}${t.committee?`<span class="chip">${esc(t.committee)}</span>`:""}</div>${acts.length||pres?`<div class="row"><div class="iconbtns">${acts.join("")}</div>${pres}</div>`:""}</article>`;
}

/* ---------- suggestions ---------- */
function allSuggestions(){const out=[];for(const d of S.suggestions)for(const[k,v]of Object.entries(d.items||{}))if(v&&v.title)out.push({...v,key:k,uid:d.id});return out.sort((a,b)=>(b.at||"").localeCompare(a.at||""))}
function suggestions(){
  const all=allSuggestions(),formUrl=safeUrl(CFG.formUrl),can=canJoin();
  let out=head(`Ideas, vending machine requests and problems around school. Council reads every one and replies here.`,"Suggestions and reports",can?`<button class="btn" data-act="add-suggestion" data-cat="Report a problem">Report a problem</button><button class="btn" data-act="add-suggestion" data-cat="Vending machine">Request a vending item</button><button class="btn primary" data-act="add-suggestion">+ Make a suggestion</button>`:"");
  if(!can)out+=`<div class="banner">${formUrl?`Send your idea using the <a href="${esc(formUrl)}" target="_blank" rel="noopener">Student Council suggestion form</a>.`:needAccess("send a suggestion")}</div>`;
  else if(formUrl&&!council())out+=`<p class="sub" style="margin:0">You can also use the <a href="${esc(formUrl)}" target="_blank" rel="noopener">Student Council suggestion form</a>.</p>`;
  if(council()){
    resolveIds(all.map(x=>x.uid));
    const list=sugFilter==="all"?all:sugFilter==="open"?all.filter(x=>x.status==="new"||x.status==="review"):all.filter(x=>x.status===sugFilter);
    out+=`<div class="toolbar"><label for="sugFilter" class="sub">Show</label><select id="sugFilter">${[["open","New and under review"],["all","All suggestions"],...SUG_STATUS].map(([v,l])=>`<option value="${v}" ${v===sugFilter?"selected":""}>${l}</option>`).join("")}</select><span class="sub">${all.filter(x=>x.status==="new").length} new</span></div>`;
    out+=list.length?`<ul class="sugs">${list.map(x=>`<li><div class="sug-head"><span class="title">${esc(x.title)}</span><span class="sub parts"><span>${esc(x.category||"Other")}</span><span>${esc(longd((x.at||"").slice(0,10)))}</span></span></div>${x.details?`<p>${esc(x.details)}</p>`:""}${x.where?`<div class="sub">Where: ${esc(x.where)}</div>`:""}<div class="toolbar">${who(x.uid,"Someone")}<span class="sp"></span><label class="sub" for="st-${x.key}">Status</label><select id="st-${x.key}" data-sug="${esc(x.uid)}" data-key="${esc(x.key)}" ${canAct()?"":"disabled"}>${SUG_STATUS.map(([v,l])=>`<option value="${v}" ${v===(x.status||"new")?"selected":""}>${l}</option>`).join("")}</select></div>${x.reply?`<div class="reply"><b>Council reply:</b> ${esc(x.reply)}</div>`:""}${canAct()?`<div class="reply-form"><input id="rp-${x.key}" aria-label="Reply to this suggestion" placeholder="${x.reply?"Update the reply":"Write a reply the sender will see"}"><button class="btn sm" data-act="sug-reply" data-uid="${esc(x.uid)}" data-key="${esc(x.key)}">Send reply</button></div>`:""}</li>`).join("")}</ul>`:empty(sugFilter==="open"?"Nothing waiting":"No suggestions here",sugFilter==="open"?"Every suggestion has been looked at. Switch to All suggestions to see past ones.":"Suggestions people send show up here.");
  }else if(can){
    out+=`<section class="panel"><h2>Your suggestions</h2>${all.length?`<ul class="sugs" style="border-top:0">${all.map(x=>`<li><div class="sug-head"><span class="title">${esc(x.title)}</span><span class="state ${x.status==="done"||x.status==="planned"?"done":x.status==="declined"?"wait":"todo"}">${label(SUG_STATUS,x.status||"new")}</span></div>${x.details?`<p>${esc(x.details)}</p>`:""}${x.where?`<div class="sub">Where: ${esc(x.where)}</div>`:""}${x.reply?`<div class="reply"><b>Council reply:</b> ${esc(x.reply)}</div>`:`<span class="sub">Sent ${esc(longd((x.at||"").slice(0,10)))}. No reply yet.</span>`}</li>`).join("")}</ul>`:`<p class="sub" style="margin:10px 0 0">You haven't sent any suggestions yet. Your name is attached so council can follow up with you.</p>`}</section>`;
  }
  return out;
}
function suggestionForm(cat){
  const prob=cat==="Report a problem",vend=cat==="Vending machine";
  openForm({title:prob?"Report a problem":vend?"Request a vending machine item":"Make a suggestion",submitLabel:prob?"Send report":"Send suggestion",note:"Student Council will see your name with this so they can follow up.",
    fields:[{id:"title",label:prob?"What's wrong?":vend?"What should the vending machine stock?":"Your idea in one line",required:true,full:true},{id:"category",label:"Topic",type:"select",options:SUG_CATS.map(c=>[c,c])},...(prob?[{id:"where",label:"Where is it?"}]:[]),{id:"details",label:"Details",type:"textarea",placeholder:prob?"What happened, and since when?":vend?"Brand, flavor, why people would buy it":"What should change, and why? Who would it help?"}],
    values:{category:cat||"Events"},
    submit:vals=>{const key=Date.now().toString(36)+Math.random().toString(36).slice(2,6),item={...vals,status:"new",at:new Date().toISOString()},ref=db.doc("suggestions/"+me.id);
      return save(()=>S.suggestions.some(d=>d.id===me.id)?ref.update({items:{[key]:item}}):ref.set({items:{[key]:item}}),prob?"Report sent. Thank you!":"Suggestion sent. Thank you!")}});

/* ---------- student side ---------- */
function subnav(items){const cur=shownView();return`<div class="subnav" role="navigation" aria-label="In this section">${items.map(([k,l])=>`<a href="#${k}" ${k===cur?'aria-current="page"':""}>${l}</a>`).join("")}</div>`}
function dueIn(d){const n=Math.round((parse(d)-parse(TODAY))/864e5);return n<=0?"Today":n===1?"Tomorrow":`In ${n} days`}
function weekStart(s){const d=parse(s)||parse(TODAY);return iso(addDays(d,-((d.getDay()+6)%7)))}
const blob=id=>window.__assetUrl?window.__assetUrl(id):"/_blob/"+encodeURIComponent(id);
const HOSTED=!!window.__signIn;
const needAccess=what=>HOSTED?`<button class="btn sm" data-act="signin">Sign in</button> to ${what}.`:`To ${what}, you need contributor access to this page. Ask any Student Council member.`;

/* Student Hub */
function hubView(){const cur=shownView();return subnav([["hub","This week"],["calendar","Calendar"],["bulletin","Weekly bulletin"]])+(cur==="calendar"?calendar():cur==="bulletin"?bulletin():weekView())}
function weekView(){
  const in14=iso(addDays(new Date(),14)),in30=iso(addDays(new Date(),30)),ago7=iso(addDays(new Date(),-7));
  const changes=[...S.events.filter(e=>e.change&&e.date>=TODAY&&e.date<=in30).map(e=>({title:e.title,text:e.change,date:e.date})),...S.bulletin.filter(p=>p.tag==="Schedule change"&&(p.date||"")>=ago7).map(p=>({title:p.title,text:p.body,date:p.date}))];
  const upcoming=S.events.filter(e=>e.date>=TODAY&&e.date<=in14).sort(byDate);
  const deadlines=[...S.events.filter(e=>e.type==="deadline"&&e.date>=TODAY&&e.date<=in14).map(e=>({title:e.title,date:e.date,href:"#calendar"})),
    ...S.events.filter(e=>e.signup&&e.signup!=="none"&&e.closes&&e.closes>=TODAY&&e.closes<=in14).map(e=>({title:`${label(SIGNUP_KINDS,e.signup)} for ${e.title}`,date:e.closes,href:"#events"})),
    ...S.opps.filter(o=>o.deadline&&o.deadline>=TODAY&&o.deadline<=in14).map(o=>({title:`Apply: ${o.title}`,date:o.deadline,href:"#opportunities"}))].sort((a,b)=>a.date.localeCompare(b.date));
  const posts=sortedPosts().slice(0,4);
  return head(`What's happening at ${SCHOOL} over the next two weeks.`,"This week",canAct()?`<button class="btn" data-act="add-post">+ Post announcement</button><button class="btn primary" data-act="add-event">+ Add event</button>`:"")+
  (changes.length?`<section class="changes"><h2>Changes to know about</h2><ul>${changes.map(c=>`<li><b>${esc(c.title)}</b><span>${esc(c.text)}</span><span class="sub">${esc(longd(c.date))}</span></li>`).join("")}</ul></section>`:"")+
  `<div class="grid2"><section class="panel"><h2>Coming up <a href="#calendar">Full calendar</a></h2>${upcoming.length?`<ul class="list">${upcoming.slice(0,8).map(evRow).join("")}</ul>`:`<p class="sub" style="margin:10px 0 0">Nothing scheduled in the next two weeks.</p>`}</section>
  <section class="panel"><h2>Deadlines and reminders</h2>${deadlines.length?`<ul class="list">${deadlines.map(d=>`<li>${datebox(d.date)}<div class="grow"><a class="title" href="${d.href}">${esc(d.title)}</a><div class="sub">${dueIn(d.date)}</div></div></li>`).join("")}</ul>`:`<p class="sub" style="margin:10px 0 0">No deadlines in the next two weeks.</p>`}</section></div>`+
  `<section class="panel"><h2>Announcements <a href="#bulletin">Weekly bulletin</a></h2>${posts.length?`<div class="posts" style="margin-top:12px">${posts.map(postCard).join("")}</div>`:`<p class="sub" style="margin:10px 0 0">No announcements yet.</p>`}</section>`+
  (allPhotos().length?`<section class="panel"><h2>Around Avenues <a href="#life">Student Life</a></h2><div style="margin-top:12px">${beltsHTML(1)}</div></section>`:"");
}
function postCard(p){return`<article class="post ${p.pinned?"pinned":""}"><div class="meta"><span class="chip ${({Event:"gold",Opportunity:"good",Reminder:"bad","Schedule change":"bad",Spirit:"accent"})[p.tag]||""}">${esc(p.tag||"Announcement")}</span><span>${esc(longd(p.date))}</span>${p.pinned?`<span class="chip gold">Pinned</span>`:""}</div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><div class="meta">${p.author?`Posted by ${who(p.author,"")}`:"Posted by Student Council"}<span class="sp"></span>${canAct()?`<button class="btn sm ghost" data-act="edit-post" data-id="${p.id}">Edit</button>`:""}</div></article>`}
function bulletin(){
  const posts=sortedPosts(),pinned=posts.filter(p=>p.pinned),groups=[];
  for(const p of posts.filter(p=>!p.pinned)){const k=weekStart(p.date);let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,items:[]});g.items.push(p)}
  return head("Announcements for the whole school, collected week by week.","Weekly bulletin",addBtn("add-post","New post"))+
  (posts.length?(pinned.length?`<div class="posts">${pinned.map(postCard).join("")}</div>`:"")+groups.map(g=>`<section class="panel"><h2>${g.k===weekStart(TODAY)?"This week":"Week of "+esc(fmt(g.k,{month:"long",day:"numeric"}))}</h2><div class="posts" style="margin-top:12px">${g.items.map(postCard).join("")}</div></section>`).join("")
  :empty("The bulletin is empty","Post announcements, schedule changes, spirit week themes and anything else the school should know.","add-post","Write the first post"));
}

/* Events and sign-ups */
const SIGNUP_KINDS=[["none","No sign-up"],["rsvp","RSVP"],["signup","Sign up"],["register","Register"],["tickets","Reserve a ticket"]];
let openEvent=null,evFilter="all";
function signupsFor(eid){const out=[];for(const d of S.signups){const x=(d.events||{})[eid];if(x)out.push({uid:d.id,...x})}return out.sort((a,b)=>(a.at||"").localeCompare(b.at||""))}
const mySignups=()=>(S.signups.find(d=>d.id===me.id)||{}).events||{};
function setSignup(eid,val){const mine={...mySignups()};if(val)mine[eid]=val;else delete mine[eid];return db.doc("signups/"+me.id).set({events:mine})}
function eventsView(){
  const up=S.events.filter(e=>e.type!=="meeting"&&e.type!=="deadline"&&e.date>=TODAY).sort(byDate);
  const opts=[["all","All"],["open","Open for sign-up"],["dance","Dances"],["trip","Trips"],["competition","Competitions"],["event","School events"],["fundraiser","Fundraisers"]];
  const list=up.filter(e=>evFilter==="all"||(evFilter==="open"?e.signup&&e.signup!=="none":e.type===evFilter));
  return head("Dances, trips, tournaments and competitions. See the details and sign up in one place.","Events and sign-ups",addBtn("add-event","Add event"))+
  `<div class="fchips">${opts.map(([k,l])=>`<button class="fchip" data-act="ev-filter" data-to="${k}" aria-pressed="${evFilter===k}">${l}</button>`).join("")}</div>`+
  (list.length?`<div class="evlist">${list.map(eventCard).join("")}</div>`:empty(up.length?"Nothing in this category":"No upcoming events",up.length?"Try another filter.":canAct()?"Add a dance, trip or competition and turn on sign-ups.":"Check back soon.",up.length?null:"add-event","Add an event"));
}
function eventCard(e){
  const sus=signupsFor(e.id),mine=mySignups()[e.id],has=e.signup&&e.signup!=="none",cap=Number(e.capacity)||0,full=cap&&sus.length>=cap,closed=e.closes&&e.closes<TODAY,x=openEvent===e.id;
  const kind=label(SIGNUP_KINDS,e.signup);
  let act="";
  if(has){
    if(mine)act=`<span class="chip good">${e.signup==="tickets"?"Ticket reserved":"You're signed up"}${mine.team?` as ${esc(mine.team)}`:""}</span>${!closed&&canJoin()?`<button class="btn sm ghost" data-act="ev-cancel" data-id="${e.id}">Cancel</button>`:""}`;
    else if(closed)act=`<span class="sub">Sign-up closed</span>`;
    else if(full)act=`<span class="chip bad">Full</span>`;
    else if(canJoin())act=`<button class="btn sm primary" data-act="ev-join" data-id="${e.id}">${kind}</button>`;
    else act=`<span class="sub">${needAccess("sign up")}</span>`;
  }
  if(x&&council())resolveIds(sus.map(s=>s.uid));
  return`<article class="event"><div>${datebox(e.date)}</div><div class="grow">
    <div class="ev-top"><h3>${esc(e.title)}</h3><span class="chip ${esc(e.type)}">${label(EV_TYPES,e.type)}</span></div>
    <div class="sub parts"><span>${esc(longd(e.date))}${e.time?", "+esc(fmtTime(e.time)):""}</span>${e.location?`<span>${esc(e.location)}</span>`:""}${e.price?`<span>${esc(e.price)}</span>`:""}</div>
    ${e.change?`<div class="changenote">Changed: ${esc(e.change)}</div>`:""}
    ${has?`<div class="sub parts"><span>${sus.length} signed up</span>${cap?`<span>${Math.max(0,cap-sus.length)} of ${cap} spots left</span>`:""}${e.closes?`<span>${closed?"Closed":"Closes"} ${esc(short(e.closes))}</span>`:""}</div>`:""}
    ${x?`<div class="ev-more">${e.details||e.notes?`<div><b>Details</b><p>${esc(e.details||e.notes)}</p></div>`:""}${e.schedule?`<div><b>Schedule</b><p>${esc(e.schedule)}</p></div>`:""}${has&&sus.length?`<div><b>Who's going</b><div class="going">${council()?`<ul class="list" style="margin:0">${sus.map(s=>`<li>${who(s.uid,"Someone")}${s.team?`<span class="sub">${esc(s.team)}</span>`:""}</li>`).join("")}</ul>`:sus.slice(0,24).map(s=>avatar(s.uid)).join("")+(sus.length>24?`<span class="sub">and ${sus.length-24} more</span>`:"")}</div></div>`:""}</div>`:""}
    <div class="toolbar">${act}${e.details||e.notes||e.schedule||(has&&sus.length)?`<button class="btn sm ghost" data-act="ev-toggle" data-id="${e.id}" aria-expanded="${x}">${x?"Hide details":"Details"}</button>`:""}${canAct()?`<button class="btn sm ghost" data-act="edit-event" data-id="${e.id}">Edit</button>`:""}</div>
  </div></article>`;
}

/* Student Life */

const VIBES=["Study","Hype","Chill","Gym","Road trip","Other"];
let lifeFilter="all",gal=null;
const sortedAlbums=()=>[...S.albums].filter(a=>(a.photos||[]).length).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
function allPhotos(){const out=[];for(const a of sortedAlbums())for(const id of a.photos)out.push({id,album:a.id});return out}
function beltsHTML(maxRows=2){
  const ph=allPhotos();if(!ph.length)return"";
  const rows=maxRows===1||ph.length<8?[ph]:[ph.filter((_,i)=>i%2===0),ph.filter((_,i)=>i%2===1)];
  return`<div class="belts">${rows.map((row,r)=>{let set=row.slice();while(set.length<8)set=set.concat(row);
    const dur=Math.max(30,Math.round(set.length*250/35)),delay=-((performance.now()/1000)%dur);
    const shot=(p,hidden)=>`<button class="shot" data-act="album" data-id="${p.album}" data-photo="${esc(p.id)}" ${hidden?'tabindex="-1"':`aria-label="Open the album ${esc((S.albums.find(a=>a.id===p.album)||{}).title||"")}"`}><img src="${blob(p.id)}" alt="" loading="lazy" decoding="async"></button>`;
    return`<div class="belt${r?" belt--back":""}"><div class="belt__track" style="--dur:${dur}s;animation-delay:${delay.toFixed(2)}s"><div class="belt__set">${set.map(p=>shot(p)).join("")}</div><div class="belt__set" aria-hidden="true">${set.map(p=>shot(p,1)).join("")}</div></div></div>`}).join("")}</div>`;
}

  sec("summary","Summary");sec("background","Background");sec("action","Proposed action");

/* PDF via jsPDF */
function buildPDF(p,template=false){
  const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:"pt",format:"letter"});
  const PW=612,PH=792,M=64,CW=PW-2*M;let y=M;
  const INK=[20,32,46],MUT=[94,104,115],ACC=[20,32,46],GOLD=[244,180,0],LINE=[213,218,224];
  const ensure=h=>{if(y+h>PH-M){doc.addPage();y=M}};
  const text=(s,{size=11,style="normal",color=INK,font="helvetica",lh=1.4,after=6,indent=0}={})=>{doc.setFont(font,style);doc.setFontSize(size);doc.setTextColor(...color);
    for(const para of String(s).split("\n")){const lines=doc.splitTextToSize(para||" ",CW-indent);for(const l of lines){ensure(size*lh);doc.text(l,M+indent,y+size);y+=size*lh}}y+=after};
  const{blocks,watermark}=exportable(p,template);
  for(const b of blocks){
    if(b.k==="org")text(b.text,{size:10,color:MUT,after:12});
    else if(b.k==="kicker")text(b.text,{size:11.5,style:"bold",color:INK,after:2});
    else if(b.k==="title")text(b.text,{size:22,font:"helvetica",style:"bold",color:template&&b.empty?MUT:INK,lh:1.2,after:12});
    else if(b.k==="meta"){for(const[k,v]of b.rows){doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...MUT);ensure(14);doc.text(k,M,y+9);doc.setFont("helvetica","normal");doc.setTextColor(...INK);const lines=doc.splitTextToSize(String(v),CW-110);lines.forEach((l,i)=>{if(i)ensure(13);doc.text(l,M+110,y+9);y+=13})}y+=6;doc.setDrawColor(...INK);doc.setLineWidth(2.2);doc.line(M,y,PW-M,y);y+=14}
    else if(b.k==="h"){ensure(40);y+=8;text(b.text,{size:13.5,style:"bold",color:INK,after:3})}
    else if(b.k==="p")text(b.text,{size:11.5,style:b.empty?"italic":"normal",color:b.empty?MUT:INK});
    else if(b.k==="res"){const y0=y;text(b.text,{size:11.5,style:"italic",color:b.empty?MUT:INK,indent:14});doc.setDrawColor(...GOLD);doc.setLineWidth(3.5);if(y>y0)doc.line(M+2,y0+2,M+2,y-8)}
    else if(b.k==="budget"){doc.setFontSize(10);const row=(a,c,bold,line=true)=>{ensure(20);doc.setFont("helvetica",bold?"bold":"normal");doc.setTextColor(...INK);const ls=doc.splitTextToSize(String(a),CW-120);ls.forEach((l,i)=>doc.text(l,M,y+12+i*12));doc.text(c,PW-M,y+12,{align:"right"});y+=Math.max(1,ls.length)*12+6;if(line){doc.setDrawColor(...LINE);doc.setLineWidth(.6);doc.line(M,y,PW-M,y)}y+=2};
      doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(...MUT);ensure(16);doc.text("Item",M,y+9);doc.text("Cost",PW-M,y+9,{align:"right"});y+=14;doc.setDrawColor(...LINE);doc.line(M,y,PW-M,y);y+=2;
      b.rows.forEach(r=>row(r.item||"—",money(r.cost),false));row("Total request",money(b.total),true,false);y+=6}

/* DOCX via JSZip (opens in Word, and converts to a Google Doc when uploaded to Drive) */
async function buildDOCX(p,template=false){
  const x=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const run=(t,o={})=>`<w:r><w:rPr><w:rFonts w:ascii="Libre Franklin" w:hAnsi="Libre Franklin"/>${o.b?"<w:b/>":""}${o.i?"<w:i/>":""}${o.caps?"<w:caps/>":""}${o.color?`<w:color w:val="${o.color}"/>`:""}${o.sp?`<w:spacing w:val="${o.sp}"/>`:""}<w:sz w:val="${(o.sz||11)*2}"/></w:rPr><w:t xml:space="preserve">${x(t)}</w:t></w:r>`;
  const para=(runs,o={})=>`<w:p><w:pPr>${o.keep?"<w:keepNext/>":""}${o.left?`<w:pBdr><w:left w:val="single" w:sz="18" w:space="8" w:color="F4B400"/></w:pBdr>`:""}<w:spacing w:before="${o.before||0}" w:after="${o.after??120}"/>${o.left?`<w:ind w:left="240"/>`:""}</w:pPr>${runs}</w:p>`;
  const lines=(t,o,po)=>String(t).split("\n").map(l=>para(run(l,o),po)).join("");
  const cell=(content,w,right)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/></w:tcPr><w:p><w:pPr><w:spacing w:before="60" w:after="60"/>${right?'<w:jc w:val="right"/>':""}</w:pPr>${content}</w:p></w:tc>`;
  const{blocks}=exportable(p,template);let body="";
  for(const b of blocks){
    if(b.k==="org")body+=para(run(b.text,{sz:8.5,color:"6B7285",sp:20}),{after:200});
    else if(b.k==="kicker")body+=para(run(b.text,{sz:10,b:true,color:"14202E",sp:20}),{after:40});
    else if(b.k==="title")body+=para(run(b.text,{sz:22,b:true,color:template&&b.empty?"6B7285":"1A1F2E"}),{after:200});
    else if(b.k==="meta"){body+=`<w:tbl><w:tblPr><w:tblW w:w="9360" w:type="dxa"/><w:tblBorders><w:bottom w:val="single" w:sz="16" w:color="14202E"/></w:tblBorders></w:tblPr><w:tblGrid><w:gridCol w:w="2200"/><w:gridCol w:w="7160"/></w:tblGrid>${b.rows.map(([k,v])=>`<w:tr>${cell(run(k,{sz:9,b:true,color:"6B7285"}),2200)}${cell(run(v,{sz:10}),7160)}</w:tr>`).join("")}</w:tbl>`+para("",{after:120})}
    else if(b.k==="h")body+=para(run(b.text,{sz:9.5,b:true,color:"14202E",sp:20}),{before:240,after:60,keep:true});
    else if(b.k==="p")body+=lines(b.text,{sz:11.5,i:b.empty,color:b.empty?"6B7285":"1A1F2E"});
    else if(b.k==="res")body+=lines(b.text,{sz:11.5,i:true,color:b.empty?"6B7285":"1A1F2E"},{left:true});
    else if(b.k==="budget"){const tr=(a,c,bold)=>`<w:tr>${cell(run(a,{sz:10,b:bold}),7160)}${cell(run(c,{sz:10,b:bold}),2200,true)}</w:tr>`;
      body+=`<w:tbl><w:tblPr><w:tblW w:w="9360" w:type="dxa"/><w:tblBorders><w:top w:val="single" w:sz="4" w:color="D9DDE6"/><w:bottom w:val="single" w:sz="4" w:color="D9DDE6"/><w:insideH w:val="single" w:sz="4" w:color="D9DDE6"/></w:tblBorders></w:tblPr><w:tblGrid><w:gridCol w:w="7160"/><w:gridCol w:w="2200"/></w:tblGrid>${tr("Item","Cost",true)}${b.rows.map(r=>tr(r.item||"—",money(r.cost))).join("")}${tr("Total request",money(b.total),true)}</w:tbl>`+para("",{after:60})}
    else if(b.k==="sig"){body+=para("",{after:600})+`<w:tbl><w:tblPr><w:tblW w:w="9360" w:type="dxa"/></w:tblPr><w:tblGrid><w:gridCol w:w="2960"/><w:gridCol w:w="240"/><w:gridCol w:w="2960"/><w:gridCol w:w="240"/><w:gridCol w:w="2960"/></w:tblGrid><w:tr>${b.names.map((n,i)=>(i?cell("",240):"")+`<w:tc><w:tcPr><w:tcW w:w="2960" w:type="dxa"/><w:tcBorders><w:top w:val="single" w:sz="6" w:color="1A1F2E"/></w:tcBorders></w:tcPr>${para(run(n,{sz:8,color:"6B7285"}),{after:0})}${para(run("Signature / Date",{sz:8,color:"6B7285"}),{after:0})}</w:tc>`).join("")}</w:tr></w:tbl>`}
  }
  const docXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1300" w:right="1440" w:bottom="1300" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const z=new JSZip();
  z.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  z.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  z.file("word/document.xml",docXml);
  return z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
async function offer(filename,data){

  if(!dl){toast("Downloads aren't available in this view.");return false}
  try{await dl.save({filename,data});toast("Saved "+filename);return true}
  catch(e){if(!e||e.code!=="declined")toast("Couldn't save the file. Try again in a moment.");return false}
}
const fileBase=p=>((p.number?p.number+" ":"")+(p.title||"Proposal")).replace(/[\\/:*?"<>|]+/g,"").slice(0,80);

async function autoApprove(){

function fieldHTML(f,v){
  const id="f-"+f.id,full=f.full||f.type==="textarea"||f.type==="photo"?" full":"",req=f.required?" required":"";
  if(f.type==="checkbox")return`<div class="field check${full}"><input type="checkbox" id="${id}" ${v?"checked":""}><label for="${id}">${f.label}</label></div>`;
  if(f.type==="photos")return`<div class="field full"><label for="${id}">${f.label}</label><div class="thumbs" id="${id}-list"></div><div class="photo-row"><input type="file" id="${id}" accept="image/*" ${f.multiple?"multiple":""}><span class="sub" id="${id}-status" role="status"></span></div>${f.help?`<span class="sub">${f.help}</span>`:""}</div>`;
  if(f.type==="photo")return`<div class="field full"><label for="${id}">${f.label}</label><div class="photo-row"><img id="${id}-prev" class="avatar xl" src="${esc(v||"")}" alt="" ${v?"":"hidden"}><input type="file" id="${id}" accept="image/*"><button type="button" class="btn sm ghost" id="${id}-clear" ${v?"":"hidden"}>Remove photo</button></div><span class="sub">Square photos look best. It's resized automatically.</span></div>`;
  let input;
  if(f.type==="textarea")input=`<textarea id="${id}"${req} placeholder="${esc(f.placeholder||"")}">${esc(v)}</textarea>`;
  else if(f.type==="select")input=`<select id="${id}">${f.options.map(([k,l])=>`<option value="${esc(k)}" ${String(v??"")===String(k)?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  else input=`<input id="${id}" type="${f.type||"text"}" value="${esc(v)}"${f.placeholder?` placeholder="${esc(f.placeholder)}"`:""}${req}${f.list?` list="${id}-l"`:""}${f.type==="number"?' min="0" step="any"':""}>${f.list?`<datalist id="${id}-l">${f.list.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`:""}`;
  return`<div class="field${full}"><label for="${id}">${f.label}</label>${input}</div>`;
}
function resizeImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=256,c=document.createElement("canvas");c.width=c.height=s;const k=Math.max(s/img.width,s/img.height),w=img.width*k,h=img.height*k;c.getContext("2d").drawImage(img,(s-w)/2,(s-h)/2,w,h);res(c.toDataURL("image/jpeg",.82))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function closeModal(){const m=$("#modal");m.hidden=true;m.innerHTML=""}
function openForm({title,fields,values={},submit,onDelete,submitLabel="Save",note=""}){
  const m=$("#modal");const photoVals={};
  m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><form id="mform" novalidate><h2 id="mt">${esc(title)}</h2>${note?`<p class="sub" style="margin:-6px 0 14px">${note}</p>`:""}<div class="fields">${fields.map(f=>fieldHTML(f,values[f.id])).join("")}</div><div class="err" id="merr"></div><div class="mactions">${onDelete?`<button type="button" class="btn danger ghost" id="mdel">Delete</button>`:""}<span class="sp"></span><button type="button" class="btn ghost" id="mcancel">Cancel</button><button class="btn primary" type="submit" id="msave">${submitLabel}</button></div></form></div>`;
  m.hidden=false;
  const first=m.querySelector("input:not([type=file]),textarea,select");first&&first.focus();
  fields.filter(f=>f.type==="photo").forEach(f=>{
    const inp=$("#f-"+f.id),prev=$("#f-"+f.id+"-prev"),clr=$("#f-"+f.id+"-clear");photoVals[f.id]=values[f.id]||"";
    inp.onchange=async()=>{const file=inp.files[0];if(!file)return;try{const url=await resizeImage(file);photoVals[f.id]=url;prev.src=url;prev.hidden=false;clr.hidden=false}catch{toast("That image couldn't be read. Try a JPG or PNG.")}};
    clr.onclick=()=>{photoVals[f.id]="";prev.hidden=true;clr.hidden=true;inp.value=""};
  });
  const lists={};let uploading=0;
  fields.filter(f=>f.type==="photos").forEach(f=>{
    const v=values[f.id];lists[f.id]=Array.isArray(v)?[...v]:v?[v]:[];
    const listEl=$("#f-"+f.id+"-list"),inp=$("#f-"+f.id),st=$("#f-"+f.id+"-status");
    const draw=()=>{listEl.innerHTML=lists[f.id].map((pid,i)=>`<div class="thumb"><button type="button" class="thumb-img" data-i="${i}" aria-label="${f.multiple&&i?"Make this the cover":"Photo "+(i+1)}"><img src="${blob(pid)}" alt="">${f.multiple&&i===0?'<span class="cover-tag">Cover</span>':""}</button><button type="button" class="thumb-x" data-x="${i}" aria-label="Remove photo ${i+1}">×</button></div>`).join("")};
    listEl.onclick=ev=>{const x=ev.target.closest("[data-x]"),c=ev.target.closest("[data-i]");if(x){lists[f.id].splice(+x.dataset.x,1);draw()}else if(c&&f.multiple){const[pick]=lists[f.id].splice(+c.dataset.i,1);lists[f.id].unshift(pick);draw()}};
    inp.onchange=async()=>{const files=[...inp.files];if(!files.length)return;
      const A=window.claude&&window.claude.use?await claude.use("assets"):null;
      if(!A){toast("Uploading photos needs Editor access to this page.");inp.value="";return}
      uploading++;let n=0;
      for(const file of files){n++;st.textContent=`Uploading ${n} of ${files.length}…`;try{const b=await resizeToBlob(file,1800);const r=await A.upload(b);if(f.multiple)lists[f.id].push(r.id);else lists[f.id]=[r.id];draw()}catch(e){toast(`${file.name} couldn't be uploaded. Try a JPG or PNG.`)}}
      uploading--;st.textContent="";inp.value=""};
    draw();
  });
  $("#mcancel").onclick=closeModal;
  if(onDelete){const d=$("#mdel");d.onclick=async()=>{if(d.dataset.armed){d.disabled=true;if(await onDelete()!==false)closeModal();else d.disabled=false}else{d.dataset.armed=1;d.textContent="Confirm delete"}}}
  $("#mform").onsubmit=async e=>{
    e.preventDefault();const vals={};
    if(uploading){$("#merr").textContent="Wait for the photos to finish uploading.";return}
    for(const f of fields){const el=$("#f-"+f.id);vals[f.id]=f.type==="photos"?(f.multiple?lists[f.id]:(lists[f.id][0]||"")):f.type==="photo"?photoVals[f.id]:f.type==="checkbox"?el.checked:f.type==="number"?(el.value===""?null:Number(el.value)):el.value.trim()}
    const miss=fields.find(f=>f.required&&!vals[f.id]);if(miss){$("#merr").textContent=`Add ${miss.label.toLowerCase()} to continue.`;return}
    $("#msave").disabled=true;
    if(await submit(vals)!==false)closeModal();else $("#msave").disabled=false;
  };
}

    case"poll-vote":return save(()=>db.doc("votes/"+me.id).set({polls:{...myVotes(),[id]:+b.dataset.i}}),"Vote saved");
    case"poll-close":{const pl=S.polls.find(x=>x.id===id);return save(()=>col("polls").doc(id).update({status:"closed"}),"Poll closed",["closed","poll",pl&&pl.question])}
    case"poll-post":{const pl=S.polls.find(x=>x.id===id);if(!pl)return;return save(()=>col("polls").doc(id).update({results:tallyPoll(pl),resultsAt:new Date().toISOString()}),"Results posted",["posted results for","poll",pl.question])}
    case"sug-reply":{const inp=$("#rp-"+b.dataset.key),v=inp.value.trim();if(!v){inp.focus();return}const x=allSuggestions().find(s=>s.key===b.dataset.key);return save(()=>db.doc("suggestions/"+b.dataset.uid).update({items:{[b.dataset.key]:{reply:v,repliedBy:me.id,repliedAt:new Date().toISOString(),...(x&&x.status==="new"?{status:"review"}:{})}}}),"Reply sent",["replied to","suggestion",x&&x.title])}
    case"task-mode":taskMode=b.dataset.to;return render();
    case"add-event":return go("event",{date:TODAY,type:"meeting"});
    case"edit-event":return forms.event()(id);
    case"day":if(canAct())go("event",{date:b.dataset.date,type:"meeting"});return;
    case"add-task":return go("task",{priority:"normal",assignee:""});
    case"edit-task":return forms.task()(id);
    case"task-move":{const t=task();return save(()=>col("tasks").doc(id).update({status:b.dataset.to,statusAt:new Date().toISOString()}),null,["moved to "+label(TASK_STATUS,b.dataset.to)+":","task",t&&t.title])}
    case"t-accept":{const t=task();return save(()=>setClaim(id,"accepted"),"Task accepted",["accepted","task",t&&t.title])}
    case"t-claim":{const t=task(),to=b.dataset.to;return save(()=>setClaim(id,to),to==="done"?"Nice work":null,[to==="done"?"finished":to==="doing"&&taskState(t).status==="done"?"reopened":"started","task",t&&t.title])}
    case"t-drop":{const t=task();return save(()=>setClaim(id,null),"Task dropped",["dropped","task",t&&t.title])}
    case"add-post":return go("post",{date:TODAY,tag:"Announcement",author:amMember()&&myDoc()?me.id:""});
    case"edit-post":return forms.post()(id);
    case"new-proposal":return openEditor(null);
    case"edit-proposal":return openEditor(id);
    case"ed-cancel":editing=null;$("#main").innerHTML="";return render();
    case"ed-save":return saveEditor();
    case"b-add":readEditor();editing.d.budget.push({item:"",cost:null});$("#budget").innerHTML=budgetRows(editing.d.budget);return;
    case"b-del":readEditor();editing.d.budget.splice(Number(b.dataset.i),1);$("#budget").innerHTML=budgetRows(editing.d.budget);$("#preview").innerHTML=docHTML(editing.d);return;
    case"export":b.disabled=true;await exportProposal(id,b.dataset.kind);b.disabled=false;return;
    case"pick-proposal":selProposal=id;return render();
    case"p-stage":{const p=S.proposals.find(x=>x.id===id);return save(()=>col("proposals").doc(id).update({status:b.dataset.to}),null,["marked as "+label(P_STAGES,b.dataset.to).toLowerCase()+":","proposal",p&&p.title])}
    case"p-close":{const p=S.proposals.find(x=>x.id===id),t=tally(p),pass=t.aye>t.nay;return save(()=>col("proposals").doc(id).update({status:pass?"passed":"failed"}),pass?"Proposal passed":"Proposal failed",[`closed the vote (${t.aye}–${t.nay}–${t.abstain}, ${pass?"passed":"failed"}) on`,"proposal",p.title])}
    case"vote":{const p=S.proposals.find(x=>x.id===id);return save(()=>col("proposals").doc(id).update({votes:{[b.dataset.m]:b.dataset.v}}),null,[`recorded ${nameOf(b.dataset.m)}'s vote (${label(VOTES,b.dataset.v)}) on`,"proposal",p&&p.title])}
    case"add-meeting":return go("meeting",{date:TODAY,title:"General council meeting"});
    case"edit-meeting":return forms.meeting()(id);
    case"pick-meeting":selMeeting=id;return render();
    case"mark":{const m=S.meetings.find(x=>x.id===id);return save(()=>col("meetings").doc(id).update({records:{[b.dataset.m]:b.dataset.v}}),null,[`marked ${nameOf(b.dataset.m)} ${label(ATT,b.dataset.v).toLowerCase()} at`,"meeting",m&&m.title])}
    case"all-present":{const r={},m=S.meetings.find(x=>x.id===id);roster().forEach(x=>r[x.id]="present");return save(()=>col("meetings").doc(id).update({records:r}),"Everyone marked present",["marked everyone present at","meeting",m&&m.title])}
    case"cal-prev":calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);return render();
    case"cal-next":calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);return render();
    case"cal-today":calCursor=firstOfMonth(new Date());return render();
    case"sample":b.disabled=true;return loadSample();
  }
});
document.addEventListener("change",e=>{if(e.target.id==="sugFilter"){sugFilter=e.target.value;render()}
  if(e.target.dataset&&e.target.dataset.sug){const t=e.target,x=allSuggestions().find(s=>s.key===t.dataset.key);save(()=>db.doc("suggestions/"+t.dataset.sug).update({items:{[t.dataset.key]:{status:t.value,reviewedBy:me.id,reviewedAt:new Date().toISOString()}}}),"Status updated",["marked as "+label(SUG_STATUS,t.value).toLowerCase()+":","suggestion",x&&x.title])}
  if(e.target.id==="taskFilter"){taskFilter=e.target.value;render()}if(e.target.id==="histFilter"){histFilter=e.target.value;render()}});
document.addEventListener("keydown",e=>{if(!$("#modal").hidden){if(e.key==="Escape")closeModal();return}if(gal){if(e.key==="Escape")closeGallery();else if(e.key==="ArrowLeft")galStep(-1);else if(e.key==="ArrowRight")galStep(1)}});
document.addEventListener("click",e=>{if(e.target.id==="gallery")closeGallery()});

/* ---------- sample council (president only; example data marked sample:true) ---------- */
async function loadSample(){
  const d=n=>iso(addDays(new Date(),n));
  const ok=await save(async()=>{
    const names=[["Maya Chen","Vice President","11","Spirit","Runs Spirit Week and pep rallies."],["Jordan Ellis","Secretary","11","Communications","Takes minutes and runs the bulletin."],["Sam Ortiz","Treasurer","12","Fundraising","Keeps the budget and the cash box."],["Leo Park","Class Representative","9","Service","Freshman rep. Organizing the food drive."],["Ava Brooks","Class Representative","10","Events","Sophomore rep. Planning the winter formal."]];
    const ids=[],roles={};
    for(const[name,role,grade,committee,bio]of names){const r=col("members").doc();await r.set({name,grade,committee,bio,manual:true,sample:true});ids.push(r.id);roles[r.id]=role}
    await cfgSet(c=>Object.assign(c.roles,roles));
    for(const e of[{title:"Weekly council meeting",date:d(5),time:"15:15",type:"meeting",location:"Room 204"},{title:"Spirit Week begins",date:d(10),type:"event",location:"Whole school"},{title:"Winter formal budget due",date:d(8),type:"deadline"},{title:"Bake sale",date:d(14),time:"11:30",type:"fundraiser",location:"Cafeteria"},{title:"Weekly council meeting",date:d(12),time:"15:15",type:"meeting",location:"Room 204"}])await col("events").add({...e,sample:true});
    for(const t of[{title:"Book the gym for the winter formal",assignee:ids[4],due:d(3),priority:"high",committee:"Events"},{title:"Design Spirit Week posters",assignee:ids[0],due:d(6),priority:"normal",committee:"Spirit"},{title:"Send meeting minutes to advisor",assignee:ids[1],due:d(-1),priority:"normal",committee:"Communications"},{title:"Run the bake sale table at lunch",assignee:"",due:d(14),priority:"low",committee:"Fundraising"}])await col("tasks").add({...t,sample:true,created:new Date().toISOString()});
    for(const p of[{title:"Spirit Week themes are here",tag:"Spirit",date:d(0),author:ids[0],pinned:true,body:"Monday: Pajama Day\nTuesday: Decades Day\nWednesday: Jersey Day\nThursday: Twin Day\nFriday: School Colors"},{title:"Bake sale volunteers needed",tag:"Opportunity",date:d(-2),author:ids[2],body:"Sign up with any council member to bake or work a shift. Proceeds go to the winter formal."}])await col("bulletin").add({...p,sample:true});
    const yy=String(new Date().getFullYear()).slice(2);
    await col("proposals").add({number:`P-${yy}-01`,title:"Water bottle filling station by the gym",sponsor:ids[3],cosponsors:"Ava Brooks, Sam Ortiz",committee:"Service",budget:[{item:"Filling station unit",cost:950},{item:"Installation by district facilities",cost:250}],date:d(-6),status:"voting",summary:"Fund one water bottle filling station outside the gym from the council budget.",background:"Students fill bottles at the gym fountain, which is slow and often broken. In our October survey, 212 of 340 students said they skip refilling during PE.",action:"The Treasurer will request a quote from district facilities and place the order. Facilities installs it over winter break.",timeline:"Dec 1: order placed\nDec 22 – Jan 2: installation\nJan 10: report back to council",impact:"Fewer plastic bottles bought at the student store, and students stay hydrated during PE and practice.",resolution:"BE IT RESOLVED that the Student Council approves up to $1,200 from the general fund to purchase and install one water bottle filling station outside the gym.",votes:{[ids[0]]:"aye",[ids[1]]:"aye",[ids[2]]:"nay"},sample:true});
    await col("meetings").add({title:"General council meeting",date:d(-2),records:{[ids[0]]:"present",[ids[1]]:"late",[ids[2]]:"present",[ids[3]]:"absent",[ids[4]]:"excused"},sample:true});
  },"Sample council loaded. Edit or delete anything.",["loaded the sample council","settings",""]);
  if(!ok)render();
}

/* ---------- boot ---------- */
render();
(async()=>{
  if(!window.claude||!window.claude.use){setStatus("offline");render();return}
  const[d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
  db=d;U=u;
  if(u){const m=await u.me();me={id:m.id,name:m.name,email:m.email,avatarUrl:m.avatarUrl,color:m.color};isPres=!!m.isOwner;isEditor=!!m.canEdit||isPres;const c=await u.can("data.write");if(c===false)canWrite=false}
  if(!db){setStatus("nodb");render();return}
  const cols=COLS.filter(c=>isEditor||!COUNCIL_ONLY.includes(c));
  const subs=[...cols,"config"].concat(isPres?["admin"]:[]);
  const timer=setTimeout(()=>{if(loaded.size<subs.length)setStatus("slow")},10000);
  const done=(k,snap)=>{if(!snap.metadata.fromCache)loaded.add(k);if(loaded.size>=subs.length){clearTimeout(timer);setStatus("ok")}};
  const fail=()=>{clearTimeout(timer);setStatus("err");render()};
  cols.forEach(c=>col(c).onSnapshot(snap=>{S[c]=snap.docs.map(x=>({id:x.id,...x.data()}));done(c,snap);render();if(c==="members")autoApprove()},fail));
  db.doc("config/access").onSnapshot(s=>{cfgExists=s.exists;CFG={approved:{},roles:{},school:"",president:null,...(s.exists?s.data():{})};done("config",s);render()},fail);
  if(isPres)db.doc("admin/access").onSnapshot(s=>{adminExists=s.exists;ADMIN={emails:[],...(s.exists?s.data():{})};done("admin",s);render();autoApprove()},fail);
  setStatus("connecting");render();
})();
</script>
